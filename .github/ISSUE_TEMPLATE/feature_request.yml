name: 功能建议
description: 新练习模式、新课程、新词库格式、新输入法方案等
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: 想要什么
      description: 用一两句话描述功能与使用场景
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 所属方向
      options:
        - 练习体验
        - 课程体系
        - 词库导入
        - 统计与错题
        - 新输入法方案
        - 其他
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      placeholder: 解决你练习中的什么痛点
    validations:
      required: false
